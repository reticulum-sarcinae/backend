services:
  mariadb:
    image: 'mariadb:12.3'
    container_name: sarcina-mariadb
    environment:
      - MARIADB_DATABASE=sarcina
      - MARIADB_USER=test
      - MARIADB_PASSWORD=test
      - MARIADB_RANDOM_ROOT_PASSWORD=1
    ports:
      - '3333:3306'
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    container_name: sarcina-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/sarcina
      - SPRING_DATASOURCE_USERNAME=test
      - SPRING_DATASOURCE_PASSWORD=test
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
